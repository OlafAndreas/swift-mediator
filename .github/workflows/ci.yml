name: CI

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-linux:
    name: Core only (Linux, no traits)
    runs-on: ubuntu-latest
    container: swift:6.4
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      # Proves the core resolves and builds with only swift-syntax.
      - run: swift test
      - name: Dependencies fetched
        run: ls .build/checkouts
      # Proves `traits: []` builds the core and the testing product without compiling swift-syntax.
      - name: Without macros
        run: |
          rm -rf .build
          swift build --disable-default-traits --target SwiftMediatorTesting -v 2>&1 | tee build.log | tail -1
          ! grep -E -- "-module-name (SwiftSyntax|SwiftParser|SwiftMediatorMacros)( |$)" build.log

  all-linux:
    name: All traits (Linux)
    runs-on: ubuntu-latest
    container: swift:6.4
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      # Two jobs: compiling Vapor and NIO at full parallelism exceeds the runner's memory.
      - run: swift build --enable-all-traits --build-tests -j 2
      - run: swift test --enable-all-traits --skip-build
      - run: swift run --enable-all-traits Example

  all-macos:
    name: All traits (macOS)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: swift --version
      - run: swift test --enable-all-traits
      - run: swift run --enable-all-traits Example
      - run: swift run --enable-all-traits OrderExample

  benchmarks:
    name: Benchmarks (release, Linux)
    runs-on: ubuntu-latest
    container: swift:6.4
    steps:
      - uses: actions/checkout@v4
      - run: swift run -c release Benchmarks
